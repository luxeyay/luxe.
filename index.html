
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>soon.</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: #f5f5f5;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
}

.container {
    text-align: center;
    animation: appear 1.5s ease;
}

h1 {
    font-size: clamp(65px, 15vw, 120px);
    font-weight: normal;
    letter-spacing: -5px;
}

p {
    margin-top: 5px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: #999;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>soon.</h1>
    <p>(i love fuwatti)</p>
</div>

</body>
</html>
