
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>soon.</title>

    <!-- Icono de la página -->
    <link rel="icon" type="image/webp" href="./1000147450.webp">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080808;
        }

        body {
            color: #f5f5f5;
            font-family: Georgia, serif;
        }

        .container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: clamp(65px, 15vw, 110px);
            font-weight: normal;
            letter-spacing: -5px;
            animation: appear 1.5s ease;
        }

        p {
            margin-top: 10px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            color: #999;
            animation: appear 2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>soon.</h1>
        <p>(i love fuwatti)</p>
    </main>

</body>
</html>
